{% extends "base.html" %}

{% block title %}Page Not Found - AI Study Assistant{% endblock %}

{% block content %}
<div class="text-center py-5">
    <div class="mb-4">
        <i class="bi bi-exclamation-triangle display-1 text-warning"></i>
    </div>
    <h1 class="display-4 fw-bold text-muted">404</h1>
    <h2 class="mb-4">Page Not Found</h2>
    <p class="lead text-muted mb-4">
        Sorry, the page you're looking for doesn't exist or has been moved.
    </p>
    <div class="d-flex justify-content-center gap-3">
        <a href="{{ url_for('index') }}" class="btn btn-primary">
            <i class="bi bi-house-door"></i> Go Home
        </a>
        <a href="{{ url_for('dashboard') if session.user_id else url_for('login') }}" class="btn btn-outline-primary">
            <i class="bi bi-speedometer2"></i> Dashboard
        </a>
    </div>
</div>
{% endblock %}
